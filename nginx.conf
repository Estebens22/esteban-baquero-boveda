server {
  listen 80; server_name boveda.estebanbaquero.com; root /usr/share/nginx/html; index index.html; charset utf-8;
  # Inyecta el popup de captura (local+cookie+DB) en todas las páginas HTML
  sub_filter_once on;
  sub_filter '</head>' '<link rel="stylesheet" href="/assets/boveda-gate.css"><script defer src="/assets/boveda-gate.js"></script></head>';
  location / { try_files $uri $uri/ =404; }
  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|gif|ico|zip)$ { expires 7d; add_header Cache-Control "public"; }
  location ~* \.zip$ { add_header Content-Disposition "attachment"; }
  gzip on; gzip_types text/css application/javascript image/svg+xml application/json text/plain;
}
